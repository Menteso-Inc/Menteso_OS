name: Daily PatentZoom Blog

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/patentzoom_seo_agent
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
      AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH }}
      SITE_NAME: ${{ secrets.SITE_NAME }}
      BRAND_TONE: ${{ secrets.BRAND_TONE }}
      DEFAULT_CATEGORY: ${{ secrets.DEFAULT_CATEGORY }}
      DEFAULT_AUTHOR: ${{ secrets.DEFAULT_AUTHOR }}
      ENABLE_FEATURED_IMAGE: ${{ secrets.ENABLE_FEATURED_IMAGE }}
      ENABLE_GOOGLE_INDEXING: ${{ secrets.ENABLE_GOOGLE_INDEXING }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agents/patentzoom_seo_agent/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Run daily SEO workflow
        run: npm run start

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patentzoom-seo-logs
          path: agents/patentzoom_seo_agent/runtime/logs
          if-no-files-found: ignore

      - name: Commit generated topic ledger
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/patentzoom_seo_agent/state/generated-posts.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update PatentZoom topic ledger"
          git push

